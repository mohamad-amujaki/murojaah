services:
  app:
    image: easypanel/murojaah/app
    container_name: murojaah-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - NODE_ENV=production
      - PORT=8787
      - STATIC_DIR=/app/static
      - MU_DB_HOST=${MU_DB_HOST}
      - MU_DB_PORT=${MU_DB_PORT:-3306}
      - MU_DB_USER=${MU_DB_USER}
      - MU_DB_PASSWORD=${MU_DB_PASSWORD}
      - MU_DB_NAME=${MU_DB_NAME}
      - MU_GOOGLE_CLIENT_ID=${MU_GOOGLE_CLIENT_ID}
      - MU_GOOGLE_CLIENT_SECRET=${MU_GOOGLE_CLIENT_SECRET}
      - MU_APP_URL=${MU_APP_URL:-https://murojaah.web.id}
      - MU_JWT_SECRET=${MU_JWT_SECRET}
      - MU_SESSION_SECRET=${MU_SESSION_SECRET}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8787/health"]
      interval: 30s
      timeout: 10s
      retries: 3
